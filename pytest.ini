[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
pythonpath = .
addopts = --cov=app/api --cov=app/services --cov=app/core --cov-report=term-missing --cov-fail-under=70
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
branch = True
concurrency = thread, greenlet
source =
    app/api
    app/services
    app/core
omit =
    */__pycache__/*
    */ai_runtime/*

[coverage:report]
fail_under = 70
show_missing = True
skip_covered = False
