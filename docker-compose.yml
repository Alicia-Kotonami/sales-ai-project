services:
  postgres:
    image: postgres:16
    container_name: salesai-postgres
    environment:
      POSTGRES_USER: salesai
      POSTGRES_PASSWORD: salesai
      POSTGRES_DB: salesai
    ports:
      - "5432:5432"
    volumes:
      - salesai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: salesai-redis
    ports:
      - "6379:6379"
    volumes:
      - salesai_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  salesai_pgdata:
  salesai_redisdata:
