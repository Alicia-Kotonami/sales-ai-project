services:
  postgres:
    image: postgres:16
    container_name: salesai-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-please_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-salesai}
    volumes:
      - salesai_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: salesai-redis-prod
    volumes:
      - salesai_redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salesai-app
    env_file:
      - .env.production
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  salesai_pgdata_prod:
  salesai_redisdata_prod:
